title: 'Texstyle Test'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: bard_field
            field:
              buttons:
                - h1
                - h2
                - italic
                - anchor
                - table
                - branded
                - bts_attributes
                - bts_pins
              remove_empty_nodes: false
              display: 'Bard Field'
              type: bard
              link_collections:
                - pages
              container: assets
              bts_pins:
                - icon
                - footnote
                - date
          -
            handle: bard_field_duplicate
            field:
              buttons:
                - h1
                - h2
                - italic
                - anchor
                - table
                - branded
                - bts_attributes
                - bts_pins
              remove_empty_nodes: false
              display: 'Bard Field (Duplicate)'
              type: bard
              link_collections:
                - pages
              container: assets
              bts_pins:
                - icon
                - footnote
                - date
          -
            handle: bard_field_html
            field:
              buttons:
                - bts_styles
                - bts_attributes
                - title
                - h1
                - h2
                - h3
                - intro
                - brand
                - unorderedlist
                - orderedlist
                - square_list
                - roman_list
                - two_columns
                - three_columns
                - anchor
                - action
                - horizontalrule
                - bold
              save_html: true
              remove_empty_nodes: false
              display: 'Bard Field (Save HTML)'
              type: bard
              visibility: hidden
              bts_styles_button: text
              bts_styles:
                - h1
                - h2
                - h3
                - h4
                - h5
                - h6
                - title
                - square_list
                - roman_list
                - brand
              placeholder: Example
          -
            handle: page_builder
            field:
              type: replicator
              display: 'Page Builder'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    new_set:
                      display: 'New Set'
                      fields:
                        -
                          handle: bard_field
                          field:
                            buttons:
                              - h2
                              - h3
                              - bold
                              - italic
                              - unorderedlist
                              - orderedlist
                              - removeformat
                              - quote
                              - anchor
                              - image
                              - table
                              - bts_pins
                            remove_empty_nodes: false
                            bts_pins:
                              - footnote
                            type: bard
                            display: 'Bard Field'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - 'new \Statamic\Rules\UniqueEntryValue({collection}, {id}, {site})'
