title: 'Texstyle Test'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: bard_field
            field:
              buttons:
                - h1
                - h2
                - italic
                - unorderedlist
                - orderedlist
                - anchor
                - table
                - branded
                - bts_attributes
                - bts_pins
              remove_empty_nodes: false
              display: 'Bard Field'
              type: bard
              link_collections:
                - pages
              container: assets
              bts_pins:
                - icon
                - footnote
                - date
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - 'new \Statamic\Rules\UniqueEntryValue({collection}, {id}, {site})'
