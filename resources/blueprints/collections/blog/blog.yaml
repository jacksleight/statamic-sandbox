title: Blog
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: intro
            field:
              buttons:
                - bold
                - italic
                - small
                - removeformat
                - anchor
                - bts_attributes
              type: bard
              display: Intro
          -
            handle: hero_image
            field:
              mode: grid
              restrict: true
              max_files: 1
              type: assets
              display: 'Hero Image'
          -
            handle: main_content
            field:
              buttons:
                - h1
                - h2
                - h3
                - h4
                - h5
                - h6
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
                - strikethrough
                - code
                - codeblock
                - horizontalrule
              container: assets
              reading_time: true
              type: bard
              display: 'Main Content'
              sets:
                main:
                  display: Main
                  sets:
                    code_block:
                      display: 'Code Block'
                      fields:
                        -
                          handle: code
                          field:
                            mode: php
                            type: code
                            display: Code
                    ddfdsf:
                      display: ddfdsf
                      fields: {  }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - required
                - 'new \Statamic\Rules\UniqueEntryValue({collection}, {id}, {site})'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: author
            field:
              max_items: 1
              type: users
              listable: true
              display: Author
              default: current
